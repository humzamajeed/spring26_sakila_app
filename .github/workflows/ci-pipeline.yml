name: CI Pipeline

# ─────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

# ─────────────────────────────────────────
# Cancel in-progress runs on new push
# ─────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────
# Workflow-level environment variables
# ─────────────────────────────────────────
env:
  PYTHON_VERSION: '3.9'
  IMAGE_NAME: sakila-app

# ─────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────
jobs:

  # ───────────────────────────────────────
  # Job 1: Lint (Code Quality Check)
  # ───────────────────────────────────────
  lint:
    name: Code Quality Check (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 linter
        continue-on-error: true
        run: |
          flake8 . \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E302,E303,W291,W293,F401,E128,E124 \
            --exclude=.git,__pycache__,*.pyc,.env,sakila-db \
            --count \
            --statistics

  # ───────────────────────────────────────
  # Job 2: Test (Unit Tests with MySQL)
  # ───────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    # MySQL service container
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_DATABASE: sakila
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -padmin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Environment variables for connecting to MySQL service
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: admin
      MYSQL_DB: sakila

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Wait for MySQL to be healthy
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -padmin --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Attempt $i: MySQL not ready yet, waiting 5s..."
            sleep 5
          done

      - name: Download Sakila database
        run: |
          curl -L -o sakila-db.tar.gz \
            https://downloads.mysql.com/docs/sakila-db.tar.gz
          tar -xzf sakila-db.tar.gz
          ls sakila-db/

      - name: Import Sakila schema and data
        run: |
          mysql -h 127.0.0.1 -u root -padmin < sakila-db/sakila-schema.sql
          mysql -h 127.0.0.1 -u root -padmin < sakila-db/sakila-data.sql
          echo "Sakila database imported successfully"

      - name: Verify Sakila database loaded
        run: |
          mysql -h 127.0.0.1 -u root -padmin -e "SHOW DATABASES;"
          mysql -h 127.0.0.1 -u root -padmin -e "USE sakila; SHOW TABLES;"

      - name: Run pytest
        run: pytest tests/ -v

  # ───────────────────────────────────────
  # Job 3: Build (Docker Image Build)
  # ───────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Verify image was created
        run: docker images

      - name: Smoke test — start container and check port 5000
        run: |
          # Start the container
          docker run -d \
            --name smoke-test \
            -p 5000:5000 \
            -e MYSQL_HOST=localhost \
            -e MYSQL_USER=root \
            -e MYSQL_PASSWORD=admin \
            -e MYSQL_DB=sakila \
            ${{ env.IMAGE_NAME }}:latest

          # Wait for it to start
          echo "Waiting for app to start..."
          sleep 10

          # Check if container is still running
          docker ps

          # Try to reach port 5000
          curl --retry 5 \
               --retry-delay 3 \
               --retry-connrefused \
               http://localhost:5000 || \
          echo "App did not respond on port 5000 — check logs below"

          # Show container logs regardless
          docker logs smoke-test

          # Clean up
          docker rm -f smoke-test

  # ───────────────────────────────────────
  # Job 4: Security Scan (Trivy)
  # ───────────────────────────────────────
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          output: trivy-report.txt
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM

      - name: Show scan summary
        run: |
          echo "=== TRIVY SECURITY SCAN REPORT ==="
          cat trivy-report.txt

      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt
          retention-days: 30
