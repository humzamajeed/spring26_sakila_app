name: CD Pipeline

# ─────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      # Only trigger on application code changes
      - 'app.py'
      - 'config.py'
      - 'templates/**'
      - 'static/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'docker-compose.yml'
      # Do NOT trigger on:
      # - README.md
      # - docs/**
      # - *.md
      # - .gitignore

  # Also trigger after CI pipeline completes successfully
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

# ─────────────────────────────────────────
# Workflow-level variables
# ─────────────────────────────────────────
env:
  IMAGE_NAME: sakila-app
  PYTHON_VERSION: '3.9'

# ─────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────
jobs:

  # ───────────────────────────────────────
  # Job 1: Deploy to Staging
  # ───────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    # Only run if workflow_run trigger succeeded
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print staging environment info
        run: |
          echo "=========================================="
          echo "  STAGING DEPLOYMENT STARTED"
          echo "=========================================="
          echo "Branch:     ${{ github.ref_name }}"
          echo "Commit:     ${{ github.sha }}"
          echo "Actor:      ${{ github.actor }}"
          echo "Repo:       ${{ github.repository }}"
          echo "Run ID:     ${{ github.run_id }}"
          echo "Triggered:  ${{ github.event_name }}"
          echo "Timestamp:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=========================================="

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build staging Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:staging \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Run staging container
        run: |
          docker run -d \
            --name sakila-staging \
            -p 5000:5000 \
            -e MYSQL_HOST=localhost \
            -e MYSQL_USER=root \
            -e MYSQL_PASSWORD=admin \
            -e MYSQL_DB=sakila \
            -e ENVIRONMENT=staging \
            ${{ env.IMAGE_NAME }}:staging

          echo "Staging container started"
          sleep 5
          docker ps
          docker logs sakila-staging || true
          docker rm -f sakila-staging || true

      - name: Write staging deployment summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Staging |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.IMAGE_NAME }}:staging\`" >> $GITHUB_STEP_SUMMARY
          echo "- SHA Tag: \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Checklist" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Code checked out" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Docker image built" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Container started successfully" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Staging deployment complete" >> $GITHUB_STEP_SUMMARY

      - name: Simulate Slack notification — Staging
        run: |
          echo "📢 Slack notification: Deployment to staging successful!"
          echo "   Repo:    ${{ github.repository }}"
          echo "   Commit:  ${{ github.sha }}"
          echo "   Actor:   ${{ github.actor }}"
          echo "   Status:  SUCCESS ✅"

  # ───────────────────────────────────────
  # Job 2: Deploy to Production
  # ───────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print production environment info
        run: |
          echo "=========================================="
          echo "  PRODUCTION DEPLOYMENT STARTED"
          echo "=========================================="
          echo "Branch:     ${{ github.ref_name }}"
          echo "Commit:     ${{ github.sha }}"
          echo "Actor:      ${{ github.actor }}"
          echo "Repo:       ${{ github.repository }}"
          echo "Timestamp:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=========================================="

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:production \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .
          echo "Production image built successfully"
          docker images

      - name: Simulate production deployment
        run: |
          echo "Deploying ${{ env.IMAGE_NAME }}:production to production environment..."
          echo "Production deployment simulation complete!"

      - name: Generate version tag from date
        id: version
        run: |
          VERSION="v$(date -u +%Y.%m.%d)"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version tag: $VERSION"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          release_name: "Release ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🚀 Production Release ${{ steps.version.outputs.VERSION }}

            ### What's in this release
            - Automated production deployment
            - Commit: ${{ github.sha }}
            - Deployed by: ${{ github.actor }}
            - Timestamp: ${{ github.event.head_commit.timestamp }}

            ### Deployment Info
            - Environment: Production
            - Image: `${{ env.IMAGE_NAME }}:production`
            - Branch: `${{ github.ref_name }}`

            ### Changes
            See commit history for full list of changes in this release.
          draft: false
          prerelease: false

      - name: Write production deployment summary
        run: |
          echo "## 🎉 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.version.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY

      - name: Simulate Slack notification — Production
        run: |
          echo "📢 Slack notification: Deployment to production successful!"
          echo "   Repo:    ${{ github.repository }}"
          echo "   Version: ${{ steps.version.outputs.VERSION }}"
          echo "   Commit:  ${{ github.sha }}"
          echo "   Actor:   ${{ github.actor }}"
          echo "   Status:  SUCCESS ✅"
