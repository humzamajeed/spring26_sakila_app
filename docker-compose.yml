# docker-compose.yml
version: '3.8'

networks:
  sakila-network:
    driver: bridge

volumes:
  sakila-db-data:

services:

  # ─────────────────────────────────────────
  # Service 1: MySQL Database
  # ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: sakila-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - sakila-db-data:/var/lib/mysql
    networks:
      - sakila-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ─────────────────────────────────────────
  # Service 2: Flask Application
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sakila-app
    restart: on-failure:5
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DB: ${MYSQL_DATABASE}
    networks:
      - sakila-network
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Service 3: Adminer (DB Admin UI)
  # ─────────────────────────────────────────
  db-admin:
    image: adminer:latest
    container_name: sakila-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - sakila-network
    depends_on:
      - db

  # ─────────────────────────────────────────
  # Service 4: Test Runner (profile only)
  # ─────────────────────────────────────────
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sakila-tests
    command: python -m pytest tests/ -v
    networks:
      - sakila-network
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - test
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DB: ${MYSQL_DATABASE}
